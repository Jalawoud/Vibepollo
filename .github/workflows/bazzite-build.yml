name: Bazzite Fedora 44 build qualification
on:
  push:
    branches: [bazzite-port]
    paths:
      - '.github/workflows/bazzite-build.yml'
      - 'packaging/linux/bazzite/**'
      - 'scripts/linux_build.sh'
      - 'cmake/**'
      - 'src/**'
      - 'third-party/**'
      - 'tests/unit/test_bazzite_kernel_check.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bazzite-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    # Artifact-only qualification: no installation, signing, keys or publishing.
    if: github.repository == 'Jalawoud/Vibepollo'
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 180
    env:
      BUILD_JOBS: '2'
      BUILD_VERSION: 2.0.2-bazzite.${{ github.run_number }}
      BRANCH: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}
      SUNSHINE_REPO_OWNER: Jalawoud
      SUNSHINE_REPO_NAME: Vibepollo
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      SUNSHINE_COMPILE_DOXYGEN: 'false'
    steps:
      - name: Install checkout tools
        run: dnf install -y git tar gzip ca-certificates
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize build submodules
        shell: bash
        run: |
          set -euo pipefail
          # Checkout uses a temporary HOME; native container steps need their own
          # exact-path trust entry. Never trust arbitrary repositories with "*".
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p qualification
          # Exclude Windows WebRTC/depot_tools and documentation-only trees.
          git submodule update --init --depth 1 -- \
            third-party/build-deps third-party/glad third-party/googletest \
            third-party/inputtino third-party/libdisplaydevice \
            third-party/nanors third-party/nv-codec-headers \
            third-party/plasma-wayland-protocols third-party/Simple-Web-Server \
            third-party/TPCircularBuffer third-party/wayland-protocols \
            third-party/wlr-protocols third-party/moonlight-common-c \
            third-party/tray third-party/libvirtualdisplay third-party/libvirtualgamepad
          git submodule foreach --recursive 'git submodule update --init --depth 1'
      - name: Install additional native build tools
        run: >-
          dnf install -y nodejs npm jq sqlite-devel libcap libcap-devel
          kwin-devel qt6-qtbase-devel libkscreen-devel wayland-devel
          wayland-protocols-devel libxkbcommon-devel libuuid-devel
          python3-pytest python3-jinja2 openssl dbus-daemon bsdtar
          libwebp-devel libpng-devel libjpeg-turbo-devel systemd-devel libubsan
      - name: Install compiler bootstrap dependencies
        run: >-
          dnf install -y gcc gcc-c++ make gmp-devel mpfr-devel libmpc-devel
          flex bison texinfo gettext-devel zlib-devel zstd
      - name: Restore pinned GCC 14
        id: gcc-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ github.workspace }}/.gcc14
          key: bazzite-f44-gcc14-c9cd41fba9ebd288c4f101e4b99da934bcb96a11-cxx17-v2
      - name: Build pinned GCC 14 for CUDA
        if: steps.gcc-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          compiler_commit=c9cd41fba9ebd288c4f101e4b99da934bcb96a11
          compiler_source="$RUNNER_TEMP/gcc14-source"
          compiler_build="$RUNNER_TEMP/gcc14-build"
          git init "$compiler_source"
          git -C "$compiler_source" remote add origin https://github.com/gcc-mirror/gcc.git
          git -C "$compiler_source" fetch --depth=1 origin "$compiler_commit"
          git -C "$compiler_source" checkout --detach FETCH_HEAD
          test "$(git -C "$compiler_source" rev-parse HEAD)" = "$compiler_commit"
          mkdir -p "$compiler_build"
          cd "$compiler_build"
          # Keep GCC 14 host-build code on its expected string-literal semantics.
          # Set the compiler command so nested configure scripts inherit the mode.
          CXX="g++ -std=gnu++17" "$compiler_source/configure" --prefix="$GITHUB_WORKSPACE/.gcc14" \
            --enable-languages=c,c++ --disable-multilib --disable-bootstrap \
            --disable-libsanitizer --with-system-zlib --without-isl
          make -j2
          make install
          ln -s gcc "$GITHUB_WORKSPACE/.gcc14/bin/gcc-14"
          ln -s g++ "$GITHUB_WORKSPACE/.gcc14/bin/g++-14"
      - name: Verify and activate GCC 14
        shell: bash
        run: |
          set -euo pipefail
          for compiler in gcc-14 g++-14; do
            version=$("$GITHUB_WORKSPACE/.gcc14/bin/$compiler" -dumpfullversion -dumpversion)
            echo "$compiler version: $version"
            case "$version" in
              14|14.[0-9]*) ;;
              *) echo "Expected GCC 14, got $version" >&2; exit 1 ;;
            esac
          done
          echo 'int main() { return 0; }' > "$RUNNER_TEMP/compiler-probe.cpp"
          "$GITHUB_WORKSPACE/.gcc14/bin/g++-14" -std=c++23 \
            "$RUNNER_TEMP/compiler-probe.cpp" -o "$RUNNER_TEMP/compiler-probe"
          "$RUNNER_TEMP/compiler-probe"
          echo "$GITHUB_WORKSPACE/.gcc14/bin" >> "$GITHUB_PATH"
      - name: Cache verified compiler
        if: steps.gcc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ github.workspace }}/.gcc14
          key: bazzite-f44-gcc14-c9cd41fba9ebd288c4f101e4b99da934bcb96a11-cxx17-v2
      - name: Install Fedora build dependencies and CUDA toolkit
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/linux_build.sh -s --cuda-patches --step=deps 2>&1 | tee qualification/dependencies.log
      - name: Record toolchain and run kernel-check harness tests
        shell: bash
        run: |
          mkdir -p qualification
          rpm -qa | sort > qualification/fedora-packages.txt
          git rev-parse HEAD > qualification/source-commit.txt
          git submodule status --recursive > qualification/submodules.txt
          python3 tests/unit/test_bazzite_kernel_check.py
      - name: Configure native host and KWin bridge
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/linux_build.sh -s --cuda-patches --step=cmake 2>&1 | tee qualification/configure.log
      - name: Compile host and tests
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/linux_build.sh -s --step=build 2>&1 | tee qualification/build.log
      - name: Expose system UBSan runtime to pinned test compiler
        shell: bash
        run: |
          set -euo pipefail
          # The pinned compiler has no bundled sanitizer; keep tests enabled
          # using the system runtime through a job-local linker directory.
          runtime=$(gcc -print-file-name=libubsan.so.1)
          test -f "$runtime"
          mkdir -p qualification/test-libs
          ln -s "$(realpath "$runtime")" qualification/test-libs/libubsan.so
          export LIBRARY_PATH="$GITHUB_WORKSPACE/qualification/test-libs"
          echo "LIBRARY_PATH=$LIBRARY_PATH" >> "$GITHUB_ENV"
          echo 'int main() { return 0; }' > "$RUNNER_TEMP/ubsan-probe.cpp"
          "$GITHUB_WORKSPACE/.gcc14/bin/g++-14" -fsanitize=undefined "$RUNNER_TEMP/ubsan-probe.cpp" -o "$RUNNER_TEMP/ubsan-probe"
          "$RUNNER_TEMP/ubsan-probe"
      - name: Run CTest
        shell: bash
        run: |
          set -euo pipefail
          # Permission tests must run without root's DAC override. Use Fedora's
          # native compiler for test-time helper/sanitizer probes; the host
          # and CUDA artifacts above remain built with pinned GCC 14.
          useradd --create-home bazzite-tester
          chown -R bazzite-tester:bazzite-tester "$GITHUB_WORKSPACE"
          runuser -u bazzite-tester -- bash -c '
            set -euo pipefail
            # runuser resets the soft limit; the TLS stress test retains
            # thousands of live sockets by design.
            ulimit -n 16384
            exec env CC=/usr/bin/gcc CXX=/usr/bin/g++ ctest --test-dir build --output-on-failure --parallel 2
          '
      - name: Upload qualification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bazzite-fedora44-qualification
          path: |
            qualification/
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7
